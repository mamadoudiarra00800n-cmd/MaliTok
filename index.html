<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaliTok 🇲🇱</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:white;font-family:Arial}
header{
position:fixed;top:0;width:100%;height:55px;
background:#111;display:flex;align-items:center;
justify-content:space-between;padding:0 15px;z-index:10
}
.logo{color:#ff3155;font-size:24px;font-weight:bold}
.feed{
height:100vh;overflow-y:auto;
scroll-snap-type:y mandatory
}
.post{
height:100vh;position:relative;
display:flex;align-items:center;
justify-content:center;background:#202020;
scroll-snap-align:start
}
.post video{
width:100%;height:100%;object-fit:contain
}
.info{
position:absolute;bottom:85px;left:15px;
right:75px;text-shadow:1px 1px 4px black
}
.actions{
position:absolute;right:12px;bottom:110px;
display:flex;flex-direction:column;gap:25px;
align-items:center
}
.actions button{
background:none;border:0;color:white;
font-size:27px;cursor:pointer
}
.actions small{font-size:12px}
nav{
position:fixed;bottom:0;width:100%;height:60px;
background:#111;display:flex;
justify-content:space-around;align-items:center;
z-index:10
}
nav button{background:none;color:white;
border:0;font-size:13px}
.upload{
background:#ff3155;color:white;
padding:12px 18px;border-radius:25px;
border:0;font-weight:bold
}
#picker{display:none}
.empty{font-size:20px;text-align:center;padding:20px}
</style>
</head>
<body>

<header>
<div class="logo">🇲🇱 MaliTok</div>
<div>👤 Profil</div>
</header>

<main class="feed" id="feed">
<div class="post">
<div class="empty">
<div style="font-size:65px">🎬</div>
<h2>Bienvenue sur MaliTok !</h2>
<p style="margin:15px">La vidéo du Mali commence ici.</p>
<p>Publie ta première vidéo ! 🇲🇱</p>
</div>
</div>
</main>

<div style="position:fixed;top:65px;right:12px;z-index:11">
<button class="upload" onclick="document.getElementById('picker').click()">
➕ Publier
</button>
<input id="picker" type="file" accept="video/*" multiple>
</div>

<nav>
<button onclick="window.scrollTo(0,0)">🏠 Accueil</button>
<button onclick="document.getElementById('picker').click()">➕ Publier</button>
<button onclick="alert('Profil MaliTok')">👤 Profil</button>
</nav>


<script>
const picker = document.getElementById('picker');
const feed = document.getElementById('feed');

picker.addEventListener('change', function () {
  const file = picker.files && picker.files[0];

  if (!file) {
    alert("MaliTok n'a reçu aucune vidéo.");
    return;
  }

  if (!file.type.startsWith('video/') &&
      !/\.(mp4|webm|mov|m4v|3gp)$/i.test(file.name)) {
    alert("Choisis une vidéo MP4.");
    return;
  }

  const url = URL.createObjectURL(file);

  const empty = feed.querySelector('.empty');
  if (empty) empty.parentElement.remove();

  const post = document.createElement('section');
  post.className = 'post';

  const video = document.createElement('video');
  video.src = url;
  video.controls = true;
  video.loop = true;
  video.playsInline = true;
  video.preload = 'metadata';

  const info = document.createElement('div');
  info.className = 'info';
  info.textContent = '🇲🇱 Utilisateur MaliTok — ' + file.name;

  post.appendChild(video);
  post.appendChild(info);
  feed.appendChild(post);

  video.addEventListener('error', function () {
    alert("La vidéo a été sélectionnée, mais son format ne peut pas être lu.");
  });

  post.scrollIntoView({ behavior: 'smooth' });

  alert("Vidéo ajoutée ! Appuie sur Lecture si nécessaire.");

  picker.value = '';
});
</script>


</body>
</html>
